[pytest]
pythonpath = .
testpaths = tests/integrador
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -v -n 2 --cov=. --cov-report=html:reports/coverage_html --alluredir=reports/allure-results

markers =
    smoke: pruebas principales de validación rápida
    regression: pruebas de regresión
    critical: pruebas críticas del flujo
    custom: marcador personalizado
    special: pruebas de interacciones especiales

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s- %(message)s
log_cli_date_format = %H:%M:%S

log_file = logs/pytest.log
log_file_mode = a
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)s] %(name)s- %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S