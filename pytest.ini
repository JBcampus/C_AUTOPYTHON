[pytest] 
pythonpath = . 
markers = 
    smoke: pruebas principales de validación rápida 
    regression: pruebas de regresión 
    critical: pruebas críticas del flujo
    custom: marcador personalizado
    special: pruebas de interacciones especiales
    data: pruebas estructuradas bajo enfoque Data Driven (Soluciona el warning del CI)
    #coverage: pruebas usadas para validar coverage

# Configuración de ejecución por defecto solicitada en el Trabajo Integrador
addopts = -v --tb=short --cov=helpers/tarea3 --cov=pages/tarea3 --cov-report=html:coverage-report --cov-report=term-missing --alluredir=reports/allure-results

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s- %(message)s
log_cli_date_format = %H:%M:%S

log_file = logs/pytest.log
log_file_mode = a
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)s] %(name)s- %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
